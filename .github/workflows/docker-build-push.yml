name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main # Thay đổi thành nhánh bạn muốn trigger workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0' # Thay đổi theo version .NET của bạn

      - name: Restore dependencies
        run: dotnet restore CoffeeHouseAPI/CoffeeHouseAPI.csproj

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t phuoc194203/init:v1 -f CoffeeHouseAPI/Dockerfile .

      - name: Push Docker image
        run: |
          docker push phuoc194203/init:v1

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Pull image
        run: docker pull phuoc194203/init:v1

      - name: Stop and remove old container
        run: docker rm -f my_app || true

      - name: Run image
        run: docker run -d --name my_app -p 8080:8080 -v myapp_file:/app/files phuoc194203/init:v1
